[files]
extend-exclude = [
    "dist/",
    "apps/*/dist/",
    "packages/api/.wrangler/",
    "apps/scoresheet/src-tauri/target/",
    "apps/scoresheet/src-tauri/gen/",
    ".specify/scripts/", # vendored by the Specify CLI; rewritten on every refresh
    ".specify/templates/", # same, the CLI rewrites these on refresh
    ".claude/skills/speckit-", # same, regenerated skills
]

[default]
extend-ignore-re = [
    # Rulebook draw tables pair team letters (`2. BCK`, `13. ABL`)
    "\\d+\\. ?[A-P]{3}\\b",
]

[default.extend-words]
ot = "ot" # overtime (`otCi`, `otRounds`, `OT` columns)
nd = "nd" # English ordinal suffix in seed refs (`2ndA`)
