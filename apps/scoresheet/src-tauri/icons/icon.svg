  <!--
    qzr app icon. The letters are Kanit Bold outlines (SIL Open Font License
    1.1, https://github.com/cadsondemak/kanit), spaced 4% tighter, centred on
    the lowercase letters with a 10% nudge towards the q's tail.

    The tile is the dark surface colour; android-fg.svg and android-bg.svg
    split it into the two layers of an Android adaptive icon, and
    public/favicon.svg is the browser tab version. To regenerate the Tauri icons from
    apps/scoresheet: pnpm tauri icon src-tauri/icons/icon-manifest.json
    The PWA icons are built from the resulting icon.png by pnpm pwa-icons.
  -->
