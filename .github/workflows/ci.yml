name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A PR checks out its merge into the base, so HEAD^1 is the base.
          fetch-depth: 2

      # Run the deploy's contract check for every package this PR bumps,
      # against the master it merges into, so a stale `### Bundled contract`
      # fails here instead of in the deploy after merge.
      - name: Verify contract reference for bumped packages
        if: github.event_name == 'pull_request'
        run: |
          for entry in api:packages/api web:apps/web scoresheet:apps/scoresheet; do
            pkg=${entry%%:*}
            dir=${entry#*:}
            old=$(git show "HEAD^1:$dir/package.json" | jq -r .version)
            new=$(jq -r .version "$dir/package.json")
            if [ "$old" != "$new" ]; then
              echo "$pkg: $old -> $new"
              tools/check-contract-versions.sh --ci "$pkg"
            fi
          done

      - uses: crate-ci/typos@master

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # lint-staged only formats the markdown a commit touches; this catches
      # anything that reached master without the hooks installed.
      - run: pnpm exec dprint check

      - run: pnpm type-check

      - run: pnpm lint

      - run: pnpm test:unit --run
